[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.9"
edition = "2024"
rust-version = "1.95"
license = "MIT"
homepage = "https://hivefleet.dev"
repository = "https://github.com/lamplitlabs/hive"
publish = false

[workspace.dependencies]
# internal crates
hive-gitenv = { path = "crates/hive-gitenv" }
hive-hand-core = { path = "crates/hive-hand-core" }
hive-cred = { path = "crates/hive-cred" }
hive-provider = { path = "crates/hive-provider" }
hive-store = { path = "crates/hive-store" }
hive-cli = { path = "crates/hive-cli" }
hive-bus = { path = "crates/hive-bus" }
hive-testutil = { path = "crates/hive-testutil" }
hive-provider-copilot = { path = "crates/hive-provider-copilot" }
hive-provider-fake = { path = "crates/hive-provider-fake" }
hive-provider-openai = { path = "crates/hive-provider-openai" }
hive-provider-anthropic = { path = "crates/hive-provider-anthropic" }
hive-provider-gemini = { path = "crates/hive-provider-gemini" }
hive-records = { path = "crates/hive-records" }
hive-goals = { path = "crates/hive-goals" }
hive-cred-setup = { path = "crates/hive-cred-setup" }
hive-board = { path = "crates/hive-board" }
hive-cred-command = { path = "crates/hive-cred-command" }
hive-harness = { path = "crates/hive-harness" }
hive-tally = { path = "crates/hive-tally" }
hive-tasks = { path = "crates/hive-tasks" }
hive-goals-command = { path = "crates/hive-goals-command" }
hive-ask = { path = "crates/hive-ask" }
hive-codedelivery = { path = "crates/hive-codedelivery" }
hive-evolve = { path = "crates/hive-evolve" }
hive-hooks = { path = "crates/hive-hooks" }
hive-mcp = { path = "crates/hive-mcp" }
hive-runner = { path = "crates/hive-runner" }
hive-inspect = { path = "crates/hive-inspect" }
hive-hub = { path = "crates/hive-hub" }
hive-voice = { path = "crates/hive-voice" }

# errors
anyhow = "1.0"
thiserror = "2.0"
# sqlite (bundled: no system library, like modernc.org/sqlite was)
rusqlite = { version = "0.40", features = ["bundled", "backup", "functions", "column_decltype", "hooks", "trace"] }
# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
erased-serde = "0.4"
# time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# text
regex = "1.13"
tabwriter = "1.4"
indexmap = { version = "2.14", features = ["serde"] }
# the repository's own Hive file (.hive/hive.yaml): pure Rust, no panics on bad input
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
# the team secret vault (ADR-070 rule 4): ChaCha20-Poly1305, X25519 and
# HKDF-SHA256 from aws-lc-rs, already built for rustls (no new package);
# zeroize wipes plaintext after a run
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
zeroize = "1.9"
# ids, hashing, encoding
uuid = { version = "1.26", features = ["v4"] }
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
# backups of the store: gzip through flate2 (pure Rust, no system zlib)
flate2 = "1.1"
base64 = "0.23"
rand = "0.10"
# os
libc = "0.2"
nix = { version = "0.31", features = ["signal", "process", "fs", "user", "hostname", "term"] }
signal-hook = "0.4"
# line editing and history for `hive harness chat`
rustyline = { version = "18.0", default-features = false, features = ["with-file-history"] }
which = "8.0"
walkdir = "2.5"
home = "0.5"
fs2 = "0.4"
filetime = "0.2"
# concurrency
crossbeam-channel = "0.5"
parking_lot = "0.12"
once_cell = "1.21"
# net
url = "2.5"
tokio = { version = "1.53", features = ["full"] }
hyper = { version = "1.11", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
bytes = "1.12"
futures = "0.3"
# reqwest 0.13's `rustls` feature verifies with rustls-platform-verifier; its
# `webpki-roots` / `rustls-native-certs` optional deps are not referenced by any
# code path any more, so they are not enabled.
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls", "charset", "http2", "stream", "gzip"] }
# `debug-embed` bakes `web/hub/out` into the binary in debug builds too.
# Without it, debug builds read the console bundle from the source tree at
# run time via the absolute path captured at compile time: a test binary
# reused from a shared CARGO_TARGET_DIR then points at another (removed)
# worker clone and `server::tests::embedded_export` fails spuriously.
rust-embed = { version = "8.12", features = ["debug-embed"] }
mime_guess = "2.0"
# speech to text for the hub's microphone button: NVIDIA Nemotron ASR
# through ONNX Runtime, which `hive-voice` downloads at run time and loads
# dynamically (no native library at build time). Pinned to the release that
# the runtime version in crates/hive-voice/src/catalogue.rs was tested with.
parakeet-rs = { version = "=0.4.3", default-features = false, features = ["load-dynamic"] }
# WAV decoding for the voice routes and `hive voice transcribe` (already in
# parakeet-rs's tree).
hound = "3.5"
# test
tempfile = "3.27"

[profile.release]
opt-level = 3
# Thin LTO over 16 codegen units, not fat over one: the daemon rebuilds this
# profile after every landing on the brain's main (selfupdate.rs), and the
# fat link of the `hive` binary alone took 186 s of a 246 s one-crate
# rebuild on a 12-core machine at -j6 (the daemon's half-core setting). Thin
# brings that rebuild to 77 s and a from-scratch one to 142 s, for a binary
# 38 MB instead of 31; the daemon's time goes to its children and the store,
# not to its own code, so the smaller binary was buying nothing measured.
lto = "thin"
codegen-units = 16
# Keep unwinding: hive-runner's daemon, compute and landing workers supervise
# their ticks with catch_unwind/resume_unwind; abort would turn a caught panic
# into a process exit.
panic = "unwind"
debug = false
strip = "symbols"

[profile.dev]
opt-level = 0
# file:line stays in backtraces and panics; the type/variable DWARF that made
# every workspace rlib and test binary several times larger is dropped. macOS
# keeps the default split-debuginfo = "unpacked" (no dsymutil pass).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# Dependencies carry no debuginfo. This is also what the Hive verify command
# builds with (CARGO_PROFILE_DEV_DEBUG=0), so both share one set of artifacts.
debug = false
