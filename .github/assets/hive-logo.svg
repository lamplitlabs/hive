<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="hive-title hive-description">
  <title id="hive-title">Hive</title>
  <desc id="hive-description">An agent-first control plane for software work, shown with the hive cell: a hexagon with a dot at its centre.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10233d"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56f2c3"/>
      <stop offset="0.52" stop-color="#35bff3"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="52" fill="url(#background)"/>
  <circle cx="1110" cy="72" r="92" fill="#35bff3" opacity="0.08"/>
  <circle cx="1034" cy="324" r="150" fill="#8b7cff" opacity="0.07"/>

  <g transform="translate(52 52)">
    <rect width="256" height="256" rx="66" fill="url(#mark)"/>
    <rect x="0.5" y="0.5" width="255" height="255" rx="65.5" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <!-- The hive cell at 78% of the tile, the same shape the console's sidebar,
         the favicon and the Mac app draw. -->
    <g transform="translate(28.16 28.16) scale(0.78)">
      <path d="M128 36l78 45v90l-78 45-78-45V81z" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="128" cy="126" r="14" fill="#ffffff"/>
    </g>
  </g>

  <text x="365" y="168" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="112" font-weight="800" letter-spacing="8">Hive</text>
  <text x="371" y="222" fill="#9fb7cf" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700" letter-spacing="3.4">AN AGENT-FIRST CONTROL PLANE</text>
  <text x="371" y="264" fill="#9fb7cf" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700" letter-spacing="3.4">FOR SOFTWARE WORK</text>
</svg>
