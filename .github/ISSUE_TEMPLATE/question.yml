name: Question
description: Something about Hive the docs did not answer.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The [documentation](https://hivefleet.dev/docs/) and its page of [questions people ask](https://hivefleet.dev/docs/faq/) answer the common ones. If yours is not there, ask it here.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you read or tried
      description: The page you looked at, the command you ran and what it printed.
  - type: input
    id: version
    attributes:
      label: Hive version
      description: What `hive version` prints, when the question is about something Hive did.
